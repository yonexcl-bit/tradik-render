<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SupGift">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e5ff"/>
    </linearGradient>
    <linearGradient id="rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36a"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.3" cy="0.16" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#gloss)"/>

  <!-- gift body -->
  <rect x="132" y="236" width="248" height="164" rx="30" fill="url(#box)"/>
  <!-- lid -->
  <rect x="116" y="178" width="280" height="76" rx="26" fill="url(#box)"/>
  <!-- vertical ribbon -->
  <rect x="230" y="178" width="52" height="222" rx="16" fill="url(#rib)"/>
  <!-- bow -->
  <path d="M256 178c-30 0-64-14-64-46 0-22 17-34 33-34 30 0 46 42 31 80z" fill="url(#rib)"/>
  <path d="M256 178c30 0 64-14 64-46 0-22-17-34-33-34-30 0-46 42-31 80z" fill="url(#rib)"/>
  <circle cx="256" cy="150" r="18" fill="#ffcf5c"/>

  <!-- sparkle -->
  <g fill="#ffffff" opacity="0.95">
    <path d="M400 150c4 20 10 26 30 30-20 4-26 10-30 30-4-20-10-26-30-30 20-4 26-10 30-30z"/>
  </g>
  <g fill="#ffffff" opacity="0.7">
    <path d="M120 320c2.6 13 6.4 16.8 19.4 19.4-13 2.6-16.8 6.4-19.4 19.4-2.6-13-6.4-16.8-19.4-19.4 13-2.6 16.8-6.4 19.4-19.4z"/>
  </g>
</svg>
